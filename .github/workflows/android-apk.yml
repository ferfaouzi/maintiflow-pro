name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: SDK Android
        run: |
          set -x
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
      - name: Tests unitaires + APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :server:test :server-pc:test :server-pc:fatJar testDebugUnitTest assembleDebug 2>&1 | tee ../build.log
      - name: Rapport d'erreur (issue)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Échec de la compilation (run ${GITHUB_RUN_NUMBER})"
            echo '```'
            if [ -f build.log ]; then grep -E "^e: |error:|FAILURE|What went wrong|^> " build.log | head -120; echo ---; tail -60 build.log; fi
            echo '```'
          } > report.md
          gh issue create --title "Build APK en échec #${GITHUB_RUN_NUMBER}" --body-file report.md
      - uses: actions/upload-artifact@v4
        with:
          name: maintiflow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: maintiflow-serveur-pc
          path: android/server-pc/build/libs/maintiflow-server.jar
      - name: Publier l'APK dans une release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_RUN_NUMBER}"
          cp android/app/build/outputs/apk/debug/app-debug.apk MaintiFlowPro-debug.apk
          mkdir -p serveur-pc && cp android/server-pc/build/libs/maintiflow-server.jar deploy/pc/* serveur-pc/
          (cd serveur-pc && zip -q ../MaintiFlow-serveur-PC.zip *)
          gh release create "$TAG" MaintiFlowPro-debug.apk MaintiFlow-serveur-PC.zip --title "APK de test ${TAG}" \
            --notes "APK debug et serveur PC compilés automatiquement (données de démo fictives). Non signé pour la publication." --prerelease
